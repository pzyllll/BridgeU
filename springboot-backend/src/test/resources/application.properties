spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tests: allow overriding framework beans when custom WebMvcConfig defines same bean name
spring.main.allow-bean-definition-overriding=true

# Disable bootstrap data seeding during tests (it expects full schema + real DB)
app.seed.enabled=false

# Avoid connecting to external services during tests
logging.level.root=WARN
logging.level.com.globalbuddy=INFO


